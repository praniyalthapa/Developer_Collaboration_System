apiVersion: apps/v1
kind: Deployment
metadata:
  name: devcollab-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devcollab-frontend
  template:
    metadata:
      labels:
        app: devcollab-frontend
    spec:
      containers:
        - name: frontend
          image: praniyalthapa/devcollab-frontend:1028d8e
          ports:
            - containerPort: 80
