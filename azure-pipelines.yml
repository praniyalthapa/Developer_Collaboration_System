# Docker - Build only (no push) - frontend demo
trigger:
- refactor

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build an image
      inputs:
        command: build
        dockerfile: '$(Build.SourcesDirectory)/apps/frontend/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)/apps/frontend'
        tags: |
          $(tag)